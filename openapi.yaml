openapi: 3.0.3
info:
  title: VoiceHire API
  description: |
    API REST pour automatiser les campagnes de recrutement avec VoiceHire.
    
    ## Authentification
    
    L'API utilise une authentification par clé API. Vous devez inclure votre clé API dans l'en-tête `X-API-Key` de chaque requête.
    
    ```
    X-API-Key: vh_live_XXXXXXXXXXXXX
    ```
    
    ## Format des réponses
    
    Toutes les réponses sont au format JSON. Les erreurs suivent un format standardisé :
    
    ```json
    {
      "error": {
        "code": "ERROR_CODE",
        "message": "Description de l'erreur",
        "details": {}
      }
    }
    ```
    
    ## Limites
    
    - Les numéros de téléphone doivent être des numéros français (06 ou 07)
    - Maximum 100 candidats par requête d'ajout
    - Les campagnes génèrent automatiquement 6 questions d'entretien
    
  version: 1.0.0
  contact:
    name: Support VoiceHire
    email: support@voicehire.io
    url: https://www.voicehire.io

servers:
  - url: https://app.voicehire.io
    description: Production
  - url: http://localhost:8080
    description: Développement local

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clé API au format vh_live_XXXXX

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Code d'erreur machine-readable
              example: MISSING_API_KEY
            message:
              type: string
              description: Message d'erreur human-readable
              example: API key is required
            details:
              type: object
              description: Détails supplémentaires sur l'erreur
              additionalProperties: true

    Campaign:
      type: object
      properties:
        campaign_id:
          type: string
          description: Identifiant unique de la campagne
          example: CAMP-20250701-ABC123
        job_title:
          type: string
          description: Titre du poste
          example: Développeur Full Stack
        client_name:
          type: string
          description: Nom de l'entreprise cliente
          example: TechCorp SAS
        status:
          type: string
          enum: [active, paused, completed]
          description: Statut de la campagne
        created_at:
          type: string
          format: date-time
          description: Date de création
        candidate_count:
          type: integer
          description: Nombre de candidats
          example: 25
        candidate_link:
          type: string
          format: uri
          description: Lien pour les candidats
          example: https://app.voicehire.io/apply/CAMP-20250701-ABC123

    CampaignCreateRequest:
      type: object
      required:
        - job_title
        - contract_type
        - job_description
      properties:
        job_title:
          type: string
          description: Titre du poste
          example: Développeur Full Stack Node.js/React
        contract_type:
          type: string
          enum:
            - CDI
            - CDD
            - Stage
            - Intérim
            - Contrat d'apprentissage
            - Contrat de professionnalisation
            - Freelance
          description: Type de contrat (aligné sur les valeurs du dashboard)
          example: CDI
        job_description:
          type: string
          description: Description détaillée du poste
          example: |
            Nous recherchons un développeur Full Stack passionné...
        additional_info:
          type: string
          description: Informations complémentaires
          example: Stack technique Node.js, React, PostgreSQL
        client_name:
          type: string
          description: Nom de l'entreprise cliente (optionnel, utilise le nom de l'agence par défaut)
          example: TechCorp SAS
        language:
          type: string
          enum: [fr, en, es]
          description: Langue de la campagne (agent vocal, emails, SMS, interface candidat)
          default: fr
          example: fr
        questions:
          type: array
          maxItems: 10
          description: Questions personnalisées d'entretien. Si fourni, `question_weights` est requis.
          items:
            type: string
        question_weights:
          type: array
          description: Poids de chaque question. Doit avoir la même longueur que `questions`.
          items:
            type: number
            enum: [0, 0.5, 1, 1.5, 2]
        question_binary_evaluations:
          type: array
          description: Évaluation binaire (oui/non) par question. Doit avoir la même longueur que `questions`.
          items:
            type: boolean
        enable_salary_question:
          type: string
          enum: [Non, Annuelles, Mensuelles, Horaires]
          description: Format de la question sur les prétentions salariales
          default: Non
        enable_job_search_question:
          type: boolean
          description: Demander si le candidat est en recherche active
          default: false
        enable_availability_question:
          type: boolean
          description: Demander la date de disponibilité du candidat
          default: true
        enable_introduction_question:
          type: boolean
          description: Demander au candidat de se présenter
          default: true
        enable_engage:
          type: boolean
          description: VoiceHire Engage — message d'accroche en début d'entretien (défaut hérité de l'agence)
        engage_message:
          type: string
          maxLength: 350
          description: Message personnalisé d'accroche (utilisé si `enable_engage = true`)
        enable_recapInterview:
          type: boolean
          description: Récap interview au candidat (défaut hérité de l'agence)
        enable_recapJob:
          type: boolean
          description: Récap offre au candidat (défaut hérité de l'agence)
        recap_job_message:
          type: string
          maxLength: 350
          description: Message personnalisé du récap offre (utilisé si `enable_recapJob = true`)
        enable_close:
          type: boolean
          description: VoiceHire Close — message de clôture (défaut hérité de l'agence)
        close_message:
          type: string
          maxLength: 350
          description: Message personnalisé de clôture (utilisé si `enable_close = true`)
        automatic_selection_threshold:
          type: number
          enum: [8.0, 8.5, 9.0, 9.5, 10.0]
          nullable: true
          description: Score minimum pour la sélection automatique des candidats. `null` désactive.
        override_agent_id:
          type: string
          description: |
            Voix de l'agent IA. Récupérer la liste via `GET /api/v1/voices`.
            Accepte soit un `agent_id` (voix par défaut VoiceHire) soit un `voice_id` (clone d'agence).
            Le drapeau `is_voice_clone` est déduit automatiquement côté backend.
        language_test_mode:
          type: string
          enum: [none, english, spanish, italian, german, chinese, portuguese, arabic]
          default: none
          description: Mode test linguistique pendant l'entretien
        custom_language_question:
          type: string
          description: |
            Question additionnelle pour le test linguistique. Nécessite `language_test_mode != "none"`.
            Le backend la traduit automatiquement vers la langue cible.

    CampaignUpdateRequest:
      type: object
      description: |
        Modification d'une campagne existante. Tous les champs sont optionnels — seuls les champs
        fournis sont modifiés. Si `questions` est fourni, `question_weights` est obligatoire et
        l'ensemble des questions est remplacé.
      properties:
        job_title:
          type: string
        contract_type:
          type: string
          enum:
            - CDI
            - CDD
            - Stage
            - Intérim
            - Contrat d'apprentissage
            - Contrat de professionnalisation
            - Freelance
        job_description:
          type: string
        additional_info:
          type: string
        client_name:
          type: string
        language:
          type: string
          enum: [fr, en, es]
        questions:
          type: array
          maxItems: 10
          items:
            type: string
        question_weights:
          type: array
          items:
            type: number
            enum: [0, 0.5, 1, 1.5, 2]
        question_binary_evaluations:
          type: array
          items:
            type: boolean
        enable_salary_question:
          type: string
          enum: [Non, Annuelles, Mensuelles, Horaires]
        enable_job_search_question:
          type: boolean
        enable_availability_question:
          type: boolean
        enable_introduction_question:
          type: boolean
        enable_engage:
          type: boolean
        engage_message:
          type: string
          maxLength: 350
          nullable: true
        enable_recapInterview:
          type: boolean
        enable_recapJob:
          type: boolean
        recap_job_message:
          type: string
          maxLength: 350
          nullable: true
        enable_close:
          type: boolean
        close_message:
          type: string
          maxLength: 350
          nullable: true
        automatic_selection_threshold:
          type: number
          enum: [8.0, 8.5, 9.0, 9.5, 10.0]
          nullable: true
        override_agent_id:
          type: string
          nullable: true
        language_test_mode:
          type: string
          enum: [none, english, spanish, italian, german, chinese, portuguese, arabic]
        custom_language_question:
          type: string
          nullable: true

    Voice:
      type: object
      properties:
        agent_id:
          type: string
          description: ID à utiliser dans `override_agent_id` (voix par défaut VoiceHire uniquement)
          example: agent_xxx
        voice_id:
          type: string
          description: ID à utiliser dans `override_agent_id` (clones d'agence uniquement)
          example: clone_yyy
        voice_name:
          type: string
          description: Nom de la voix (présent pour les voix par défaut)
        voice_clone_name:
          type: string
          description: Nom du clone (présent pour les clones d'agence)
        language:
          type: string
          example: fr
        description:
          type: string
          description: Description (présent pour les voix par défaut)
        preview_audio_url:
          type: string
          format: uri
          description: URL d'aperçu audio (présent pour les clones d'agence)

    VoicesListResponse:
      type: object
      properties:
        default_voices:
          type: array
          description: Voix par défaut VoiceHire — à utiliser via `agent_id`
          items:
            $ref: '#/components/schemas/Voice'
        voice_clones:
          type: array
          description: Clones de l'agence — à utiliser via `voice_id`
          items:
            $ref: '#/components/schemas/Voice'

    CampaignCreateResponse:
      type: object
      properties:
        campaign_id:
          type: string
          description: Identifiant de la campagne créée
          example: CAMP-20250701-ABC123
        candidate_link:
          type: string
          format: uri
          description: Lien à partager avec les candidats
          example: https://app.voicehire.io/apply/CAMP-20250701-ABC123
        status:
          type: string
          description: Statut initial de la campagne
          example: active
        questions_generated:
          type: integer
          description: Nombre de questions générées
          example: 6
        questions_source:
          type: string
          enum: [ai, default]
          description: Source des questions (IA ou défaut)
          example: ai

    CandidateAddRequest:
      type: object
      required:
        - candidates
      properties:
        contact_mode:
          type: string
          enum: [call, sms, email]
          default: call
          description: |
            Méthode de contact :
            - `call` (défaut) : appel téléphonique automatique immédiat. `email` requis par candidat.
            - `sms`  : SMS d'invitation à passer l'entretien (0,25 crédit). **Failover email** : si le `phone` est absent/invalide mais qu'un `email` valide est fourni, l'invitation part par email (gratuit).
            - `email` : email d'invitation à passer l'entretien (gratuit). **Failover SMS** : si l'`email` est absent/invalide mais qu'un `phone` valide est fourni, l'invitation part par SMS (0,25 crédit).

            Pour `sms` et `email`, chaque candidat doit fournir au moins une coordonnée valide (`phone` OU `email`), sinon il est rejeté.
        candidates:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - first_name
              - last_name
              - phone
            properties:
              first_name:
                type: string
                description: Prénom du candidat
                example: Jean
              last_name:
                type: string
                description: Nom du candidat
                example: Dupont
              phone:
                type: string
                description: Numéro de téléphone (format E.164, principalement FR)
                example: +33612345678
              email:
                type: string
                format: email
                description: >
                  Email du candidat. Requis si `contact_mode = call`. Pour `sms`/`email`,
                  au moins une coordonnée valide (`phone` ou `email`) est requise — le failover
                  bascule automatiquement sur le canal disponible.
                example: jean.dupont@example.com

    CandidateSummary:
      type: object
      properties:
        id:
          type: integer
          description: ID du candidat
        uuid:
          type: string
          description: UUID du candidat
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          nullable: true
        status:
          type: string
          enum: [completed, pending, voicemail, incomplete]
        interview_score:
          type: number
          nullable: true
          description: Score de l'entretien (sur 10)
        date:
          type: string
          format: date-time
        is_sourced:
          type: boolean
          description: Candidat sourcé (avec SMS)

    CandidateDetails:
      allOf:
        - $ref: '#/components/schemas/CandidateSummary'
        - type: object
          properties:
            campaign_id:
              type: string
            job_title:
              type: string
            availability:
              type: string
              nullable: true
            salary_expectation:
              type: string
              nullable: true
            interview_duration:
              type: integer
              description: Durée de l'entretien en secondes
            recherche_active:
              type: boolean
              description: En recherche active d'emploi
            ecoute_marche:
              type: boolean
              description: À l'écoute du marché
            score_details:
              type: object
              additionalProperties:
                type: object
                properties:
                  score:
                    type: number
                  explanation:
                    type: string
            transcript:
              type: object
              properties:
                presentation:
                  type: string
                  description: Présentation du candidat
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
                      timestamp:
                        type: number

    CampaignStatus:
      type: object
      properties:
        campaign_id:
          type: string
        status:
          type: string
          enum: [active, paused, completed]
        stats:
          type: object
          properties:
            total_candidates:
              type: integer
            interviews_completed:
              type: integer
            average_score:
              type: number
            time_saved_hours:
              type: number
            completion_rate:
              type: number
            qualified_count:
              type: integer
              description: Candidats avec score >= 7
            voicemail_count:
              type: integer
            incomplete_count:
              type: integer
            no_answer_count:
              type: integer

    CreditsInfo:
      type: object
      properties:
        credits_available:
          type: number
          description: Crédits disponibles
          example: 100.0
        credits_used_this_month:
          type: integer
          description: Crédits utilisés ce mois
          example: 45
        reset_date:
          type: string
          format: date
          description: Date de réinitialisation mensuelle
          example: "2025-08-01"
        subscription_type:
          type: string
          description: Type d'abonnement
          example: VoiceHire Echo
          enum: [Pay as you go, VoiceHire Echo, VoiceHire Resonance, VoiceHire Symphony]

paths:
  /api/v1/campaigns:
    get:
      summary: Lister les campagnes
      description: Récupère la liste de toutes les campagnes de l'agence
      operationId: listCampaigns
      tags:
        - Campagnes
      parameters:
        - name: page
          in: query
          description: Numéro de page (commence à 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Nombre d'éléments par page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filtrer par statut
          schema:
            type: string
            enum: [active, paused, completed]
      responses:
        '200':
          description: Liste des campagnes
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
              example:
                campaigns:
                  - campaign_id: CAMP-20250701-ABC123
                    job_title: Développeur Full Stack
                    client_name: TechCorp
                    status: active
                    created_at: "2025-07-01T10:00:00Z"
                    candidate_count: 15
                    candidate_link: https://app.voicehire.io/apply/CAMP-20250701-ABC123
                page: 1
                per_page: 20
                total: 1
                total_pages: 1
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/campaigns/create:
    post:
      summary: Créer une campagne
      description: |
        Crée une nouvelle campagne de recrutement avec génération automatique de 6 questions d'entretien.
        Les questions sont générées par IA en fonction de la description du poste.
      operationId: createCampaign
      tags:
        - Campagnes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
            examples:
              developpeur:
                summary: Développeur Full Stack
                value:
                  job_title: Développeur Full Stack Node.js/React
                  contract_type: CDI
                  job_description: |
                    Nous recherchons un développeur Full Stack passionné par les technologies web modernes.
                    
                    Responsabilités:
                    - Développer des applications web avec Node.js et React
                    - Participer à la conception de l'architecture
                    - Collaborer avec l'équipe produit
                    
                    Compétences requises:
                    - 3+ ans d'expérience
                    - Maîtrise de Node.js, React
                    - Bases de données SQL/NoSQL
                  client_name: TechCorp SAS
                  enable_salary_question: true
              commercial:
                summary: Commercial B2B
                value:
                  job_title: Commercial B2B Senior
                  contract_type: CDI
                  job_description: |
                    Recherche commercial B2B expérimenté pour développer notre portefeuille clients.
                    
                    Mission:
                    - Prospection et développement commercial
                    - Gestion d'un portefeuille clients
                    - Négociation de contrats
                  enable_salary_question: true
      responses:
        '201':
          description: Campagne créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignCreateResponse'
              example:
                campaign_id: CAMP-20250701-ABC123
                candidate_link: https://app.voicehire.io/apply/CAMP-20250701-ABC123
                status: active
                questions_generated: 6
                questions_source: ai
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_fields:
                  value:
                    error:
                      code: MISSING_REQUIRED_FIELDS
                      message: Required fields are missing
                      details:
                        missing_fields: [job_title, contract_type]
                invalid_contract:
                  value:
                    error:
                      code: INVALID_CONTRACT_TYPE
                      message: Invalid contract type
                      details:
                        valid_types:
                          - CDI
                          - CDD
                          - Stage
                          - Intérim
                          - Contrat d'apprentissage
                          - Contrat de professionnalisation
                          - Freelance
        '402':
          description: Crédits insuffisants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INSUFFICIENT_CREDITS
                  message: No credits available
                  details:
                    credits_available: 0

  /api/v1/campaigns/{campaign_id}/details:
    get:
      summary: Obtenir les détails d'une campagne
      description: |
        Récupère tous les détails complets d'une campagne : informations générales,
        questions d'entretien avec poids, et paramètres de configuration.
      operationId: getCampaignDetails
      tags:
        - Campagnes
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Identifiant unique de la campagne
          schema:
            type: string
      responses:
        '200':
          description: Détails de la campagne
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  job_title:
                    type: string
                  contract_type:
                    type: string
                  job_description:
                    type: string
                  company_name:
                    type: string
                  client_company:
                    type: string
                    nullable: true
                  additional_info:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [active, paused, completed]
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        order:
                          type: integer
                        question:
                          type: string
                        weight:
                          type: number
                  campaign_settings:
                    type: object
                    properties:
                      language_test_mode:
                        type: string
                      enable_salary_question:
                        type: string
                      enable_job_search_question:
                        type: boolean
                      enable_availability_question:
                        type: boolean
                      enable_engage:
                        type: boolean
                        nullable: true
                      enable_recap_interview:
                        type: boolean
                        nullable: true
                      enable_recap_job:
                        type: boolean
                        nullable: true
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Campagne non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/campaigns/{campaign_id}:
    patch:
      summary: Modifier une campagne
      description: |
        Met à jour les champs fournis d'une campagne existante. Tous les champs sont optionnels.
        Si `questions` est fourni, l'ensemble des questions est remplacé (et `question_weights`
        devient obligatoire).
      operationId: updateCampaign
      tags:
        - Campagnes
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Identifiant de la campagne
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdateRequest'
            examples:
              toggle_close_message:
                summary: Activer le message de clôture
                value:
                  enable_close: true
                  close_message: Merci pour votre temps, nous reviendrons vers vous sous 48h.
              update_questions:
                summary: Remplacer les questions
                value:
                  questions:
                    - Quelle est votre expérience avec Node.js ?
                    - Préférez-vous le télétravail ou le présentiel ?
                  question_weights: [2, 1]
                  question_binary_evaluations: [false, true]
              change_voice:
                summary: Changer la voix de l'agent
                value:
                  override_agent_id: agent_xxx
      responses:
        '200':
          description: Campagne mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Campagne non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/voices:
    get:
      summary: Lister les voix disponibles
      description: |
        Retourne les voix utilisables pour `override_agent_id` lors de la création ou
        modification d'une campagne. Deux groupes : les voix par défaut VoiceHire
        (utiliser `agent_id`) et les clones de l'agence (utiliser `voice_id`).
      operationId: listVoices
      tags:
        - Campagnes
      responses:
        '200':
          description: Liste des voix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicesListResponse'
              example:
                default_voices:
                  - agent_id: agent_xxx
                    voice_name: Myriam
                    language: fr
                    description: Voix professionnelle française
                voice_clones:
                  - voice_id: clone_yyy
                    voice_clone_name: Mon clone perso
                    language: fr
                    preview_audio_url: https://.../preview.mp3
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/campaigns/{campaign_id}/status:
    get:
      summary: Obtenir le statut d'une campagne
      description: Récupère les statistiques détaillées d'une campagne
      operationId: getCampaignStatus
      tags:
        - Campagnes
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Identifiant de la campagne
          schema:
            type: string
            example: CAMP-20250701-ABC123
      responses:
        '200':
          description: Statut de la campagne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatus'
              example:
                campaign_id: CAMP-20250701-ABC123
                status: active
                stats:
                  total_candidates: 50
                  interviews_completed: 35
                  average_score: 7.2
                  time_saved_hours: 11.6
                  completion_rate: 70.0
                  qualified_count: 22
                  voicemail_count: 5
                  incomplete_count: 3
                  no_answer_count: 7
        '404':
          description: Campagne non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Modifier le statut d'une campagne
      description: Change le statut d'une campagne (active, paused, completed)
      operationId: updateCampaignStatus
      tags:
        - Campagnes
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Identifiant de la campagne
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, paused, completed]
                  description: Nouveau statut
            example:
              status: paused
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: string
                  status:
                    type: string
              example:
                campaign_id: CAMP-20250701-ABC123
                status: paused
        '400':
          description: Statut invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Campagne non trouvée

  /api/v1/campaigns/{campaign_id}/candidates:
    post:
      summary: Ajouter des candidats
      description: |
        Ajoute des candidats à une campagne et les contacte selon `contact_mode` :
        appel automatique (`call`, défaut), SMS d'invitation (`sms`) ou email d'invitation (`email`).
        Maximum 100 candidats par requête.
      operationId: addCandidates
      tags:
        - Candidats
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Identifiant de la campagne
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateAddRequest'
            example:
              candidates:
                - first_name: Jean
                  last_name: Dupont
                  phone_number: "+33612345678"
                  email: jean.dupont@example.com
                - first_name: Marie
                  last_name: Martin
                  phone_number: "+33687654321"
      responses:
        '201':
          description: Candidats ajoutés avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                    description: Nombre de candidats ajoutés
                  duplicates:
                    type: integer
                    description: Nombre de doublons ignorés
                  invalid:
                    type: integer
                    description: Nombre de candidats invalides
                  calls_queued:
                    type: integer
                    description: Nombre d'appels en file d'attente
              example:
                added: 2
                duplicates: 0
                invalid: 0
                calls_queued: 2
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Campagne non trouvée

    get:
      summary: Lister les candidats d'une campagne
      description: Récupère la liste des candidats avec options de filtrage et tri
      operationId: listCandidates
      tags:
        - Candidats
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: status
          in: query
          description: Filtrer par statut
          schema:
            type: string
            enum: [completed, pending, voicemail]
        - name: min_score
          in: query
          description: Score minimum
          schema:
            type: number
            minimum: 0
            maximum: 10
        - name: sort
          in: query
          description: Ordre de tri
          schema:
            type: string
            enum: [date_desc, date_asc, score_desc, score_asc]
            default: date_desc
      responses:
        '200':
          description: Liste des candidats
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/CandidateSummary'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer

  /api/v1/campaigns/{campaign_id}/source:
    post:
      summary: Sourcing de candidats
      description: |
        Ajoute des candidats en mode sourcing et envoie une invitation à passer l'entretien.
        Canal principal SMS, avec **failover email** : si le `phone` est absent/invalide mais
        qu'un `email` valide est fourni, l'invitation part par email. Au moins une coordonnée
        valide (`phone` ou `email`) est requise par candidat.
      operationId: sourceCandidates
      tags:
        - Candidats
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateAddRequest'
      responses:
        '201':
          description: Candidats sourcés avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates_sourced:
                    type: integer
                    description: Nombre de candidats créés
                  candidates_skipped:
                    type: integer
                    description: Nombre de doublons ignorés
                  sms_sent:
                    type: integer
                    description: Nombre de SMS d'invitation envoyés
                  emails_sent:
                    type: integer
                    description: Nombre d'emails d'invitation envoyés (failover)
                  errors:
                    type: array
                    items:
                      type: object
              example:
                candidates_sourced: 5
                candidates_skipped: 0
                sms_sent: 4
                emails_sent: 1
                errors: []

  /api/v1/candidates/{candidate_id}:
    get:
      summary: Détails d'un candidat
      description: Récupère les informations complètes d'un candidat incluant la transcription
      operationId: getCandidateDetails
      tags:
        - Candidats
      parameters:
        - name: candidate_id
          in: path
          required: true
          description: ID ou UUID du candidat
          schema:
            type: string
      responses:
        '200':
          description: Détails du candidat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetails'
        '404':
          description: Candidat non trouvé

  /api/v1/account/credits:
    get:
      summary: Informations sur les crédits
      description: Récupère les informations sur les crédits disponibles et l'abonnement
      operationId: getCredits
      tags:
        - Compte
      responses:
        '200':
          description: Informations sur les crédits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsInfo'

tags:
  - name: Campagnes
    description: Gestion des campagnes de recrutement
  - name: Candidats
    description: Gestion des candidats
  - name: Compte
    description: Informations du compte